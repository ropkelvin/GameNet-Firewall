name: Build Windows app

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows x64 executable
        run: dotnet publish .\src\GameNetFirewall\GameNetFirewall.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameNetFirewall-win-x64
          path: .\artifacts\publish\
          if-no-files-found: error
